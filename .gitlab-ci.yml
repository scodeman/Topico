# Builds Topico and publishes it on GitLab Pages from the default branch.
# Merge requests and other branches only run the tests.

image: node:22

stages:
  - test
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline --no-audit --no-fund

test:
  stage: test
  script:
    - npm run typecheck
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  script:
    - npm run build
    # GitLab Pages serves the "public" artifact folder.
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
